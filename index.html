<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#171a1f">
  <title>三角洲行动</title>
  <style>
    *{ box-sizing: border-box; }
    html, body{ margin:0; padding:0; }
    body{
      min-height: 100vh;
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      padding: 24px;
      background: #171a1f;
      color: #e6e8ec;
      font-family: "PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
      text-align: center;
    }
    h1{
      margin: 0;
      font-size: clamp(30px, 9vw, 40px);
      font-weight: 700;
    }
    /* ===== 叫人的话：改这里 ===== */
    p{
      margin: 0;
      font-size: 17px;
      line-height: 1.8;
      color: #b6bac2;
    }
    /* 超链接：点我上号 */
    a{
      margin-top: 14px;
      font-size: 18px;
      font-weight: 700;
      color: #ffb020;
      text-decoration: none;
      border-bottom: 2px solid #ffb020;
      padding-bottom: 2px;
    }
    a:active{ opacity: .7; }
  </style>
</head>
<body>

  <h1>三角洲行动</h1>
  <!-- ===== 叫人的话：改这里 ===== -->
  <p>烽火地带开黑，速来。</p>
  <a href="#" id="go">直接打开游戏 →</a>

  <script>
    /* 点链接时按设备拉起游戏：
       安卓直接唤起游戏（没装跳官网），苹果走官方唤起页，电脑拉起 WeGame 版 */
    document.getElementById('go').addEventListener('click', function (e) {
      e.preventDefault();
      var ua = navigator.userAgent;
      if (/android/i.test(ua)) {
        location.href = 'intent://#Intent;package=com.tencent.tmgp.dfm;' +
                        'S.browser_fallback_url=' + encodeURIComponent('https://df.qq.com/') + ';end';
      } else if (/iphone|ipad|ipod/i.test(ua)) {
        location.href = 'https://df.qq.com/zlkdatasys/mct/d/play.shtml?device=ios';
      } else {
        /* 电脑：拉起 WeGame 客户端；页面失焦说明唤起了，没唤起则跳 WeGame 官网下载 */
        var launched = false;
        window.addEventListener('blur', function () { launched = true; });
        document.addEventListener('visibilitychange', function () {
          if (document.hidden) launched = true;
        });
        location.href = 'tencentwegame://';
        setTimeout(function () {
          if (!launched) location.href = 'https://www.wegame.com.cn/';
        }, 2500);
      }
    });
  </script>

</body>
</html>
