<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#140f26">
  <meta name="format-detection" content="telephone=no">
  <!-- 微信中分享链接时显示的标题，改这里 -->
  <title>一封写给你的祝福</title>
  <meta name="description" content="点开查收一份小小心意">
  <style>
    /* ================= 主题配色（想换风格改这里） ================= */
    :root{
      --bg-warm: #3a2344;        /* 顶部暖色 */
      --bg-mid:  #241a3e;        /* 中部 */
      --bg-deep: #140f26;        /* 底部深色 */
      --ink:      #f7efe3;       /* 正文颜色 */
      --ink-dim:  #c9b8a8;       /* 次要文字颜色 */
      --gold:     #e8c88f;       /* 金色点缀 */
      --gold-soft: rgba(232,200,143,.5);
      --card-border: rgba(232,200,143,.26);
    }

    *{ box-sizing: border-box; }
    html, body{ margin:0; padding:0; }

    body{
      min-height: 100vh;
      min-height: 100svh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 28px 0;
      overflow-x: hidden;
      background: radial-gradient(130% 80% at 50% -10%, var(--bg-warm) 0%, var(--bg-mid) 48%, var(--bg-deep) 100%);
      color: var(--ink);
      font-family: "PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    /* ================= 背景星光 ================= */
    .stars, .stars::before, .stars::after{
      position: fixed;
      width: 2px; height: 2px;
      border-radius: 50%;
      background: transparent;
      pointer-events: none;
    }
    .stars{ inset: 0; z-index: 0; }
    .stars::before{
      content: "";
      left: 8%; top: 12%;
      box-shadow:
        6vw 4vh 0 0 rgba(255,255,255,.75),
        18vw 22vh 0 0 rgba(255,255,255,.45),
        33vw 9vh 0 0 rgba(255,255,255,.65),
        46vw 30vh 0 0 rgba(255,255,255,.35),
        58vw 14vh 0 0 rgba(255,255,255,.7),
        71vw 38vh 0 0 rgba(255,255,255,.4),
        84vw 7vh 0 0 rgba(255,255,255,.6),
        93vw 26vh 0 0 rgba(255,255,255,.35),
        12vw 55vh 0 0 rgba(255,255,255,.45),
        27vw 68vh 0 0 rgba(255,255,255,.3),
        63vw 60vh 0 0 rgba(255,255,255,.4),
        88vw 72vh 0 0 rgba(255,255,255,.32);
      animation: twinkle 5s ease-in-out infinite alternate;
    }
    .stars::after{
      content: "";
      left: 0; top: 0;
      box-shadow:
        5vw 35vh 0 0 rgba(255,255,255,.5),
        22vw 80vh 0 0 rgba(255,255,255,.35),
        40vw 52vh 0 0 rgba(255,255,255,.45),
        55vw 88vh 0 0 rgba(255,255,255,.3),
        76vw 47vh 0 0 rgba(255,255,255,.5),
        96vw 62vh 0 0 rgba(255,255,255,.35);
      animation: twinkle 7s ease-in-out infinite alternate-reverse;
    }
    @keyframes twinkle{
      from{ opacity: .35; }
      to{ opacity: 1; }
    }

    /* ================= 中央暖光 ================= */
    .orb{
      position: fixed;
      z-index: 1;
      left: 50%; top: 50%;
      width: min(120vw, 900px);
      aspect-ratio: 1;
      transform: translate(-50%,-50%);
      border-radius: 50%;
      background: radial-gradient(circle, rgba(232,200,143,.16) 0%, rgba(232,200,143,.05) 40%, transparent 68%);
      filter: blur(2px);
      animation: breathe 7s ease-in-out infinite;
      pointer-events: none;
    }
    @keyframes breathe{
      0%,100%{ opacity: .7; transform: translate(-50%,-50%) scale(1); }
      50%    { opacity: 1;  transform: translate(-50%,-50%) scale(1.06); }
    }

    /* ================= 卡片 ================= */
    .card{
      position: relative;
      z-index: 2;
      width: min(88vw, 520px);
      padding: clamp(30px,8vw,52px) clamp(22px,6.5vw,46px) clamp(26px,7vw,44px);
      border-radius: 22px;
      text-align: center;
      background: linear-gradient(165deg, rgba(255,255,255,.10) 0%, rgba(255,255,255,.035) 100%);
      border: 1px solid var(--card-border);
      box-shadow: 0 26px 64px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.14);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      animation: card-in 1.1s cubic-bezier(.2,.75,.3,1) both;
    }
    @keyframes card-in{
      from{ opacity: 0; transform: translateY(26px) scale(.98); }
      to  { opacity: 1; transform: none; }
    }

    /* 卡片内元素逐个浮现 */
    .card > *{
      opacity: 0;
      animation: reveal .9s ease forwards;
    }
    .card > :nth-child(1){ animation-delay: .40s; }
    .card > :nth-child(2){ animation-delay: .55s; }
    .card > :nth-child(3){ animation-delay: .70s; }
    .card > :nth-child(4){ animation-delay: .85s; }
    .card > :nth-child(5){ animation-delay: 1.05s; }
    .card > :nth-child(6){ animation-delay: 1.30s; }
    @keyframes reveal{
      from{ opacity: 0; transform: translateY(14px); }
      to  { opacity: 1; transform: none; }
    }

    /* 顶部装饰线 */
    .ornament{
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin: 0 0 22px;
    }
    .ornament::before, .ornament::after{
      content: "";
      height: 1px; width: 46px; flex: none;
    }
    .ornament::before{ background: linear-gradient(90deg, transparent, var(--gold-soft)); }
    .ornament::after { background: linear-gradient(90deg, var(--gold-soft), transparent); }
    .gem{
      width: 7px; height: 7px; flex: none;
      background: var(--gold);
      transform: rotate(45deg);
      box-shadow: 0 0 10px rgba(232,200,143,.8);
    }

    /* 抬头 */
    .to{
      margin: 0 0 14px;
      font-size: clamp(13px,3.6vw,14px);
      letter-spacing: .42em;
      text-indent: .42em;
      color: var(--ink-dim);
    }

    /* 标题 */
    .title{
      margin: 0 0 20px;
      font-family: "STKaiti","Kaiti SC","KaiTi","PingFang SC",serif;
      font-size: clamp(26px,7.4vw,34px);
      font-weight: 600;
      letter-spacing: .08em;
      color: var(--gold);
    }
    @supports (-webkit-background-clip: text){
      .title{
        background: linear-gradient(120deg, #f7e7c6 0%, var(--gold) 45%, #d9ab63 100%);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
      }
    }

    /* 标题下的分隔线 */
    .divider{
      width: 56px; height: 1px;
      margin: 0 auto 26px;
      background: linear-gradient(90deg, transparent, var(--gold-soft), transparent);
    }

    /* 正文祝福语 */
    .message{
      margin: 0;
      font-size: clamp(15px,4.5vw,17px);
      line-height: 2.05;
      letter-spacing: .06em;
      color: var(--ink);
    }

    /* 落款 */
    .sign{
      margin: 30px 0 0;
      text-align: right;
      font-size: clamp(14px,4vw,15px);
      line-height: 1.9;
      letter-spacing: .08em;
      color: var(--ink-dim);
    }
    .sign .name{ color: var(--gold); }
  </style>
</head>
<body>

  <div class="stars" aria-hidden="true"></div>
  <div class="orb" aria-hidden="true"></div>

  <main class="card">

    <!-- 顶部装饰（不用改） -->
    <div class="ornament" aria-hidden="true"><span class="gem"></span></div>

    <!-- ===== 抬头：改这里 ===== -->
    <p class="to">致 亲爱的你</p>

    <!-- ===== 大标题：改这里 ===== -->
    <h1 class="title">愿你所愿 皆能如愿</h1>

    <div class="divider" aria-hidden="true"></div>

    <!-- ===== 正文祝福语：改这里（用 <br> 换行） ===== -->
    <p class="message">
      很高兴在茫茫人海里遇见你。<br>
      愿你往后的每一天，<br>
      都有小事让你开心，<br>
      有热爱的事可做，有在乎的人相伴。<br>
      所有的美好，都如期而至。
    </p>

    <!-- ===== 落款：改这里 ===== -->
    <p class="sign">
      —— <span class="name">你的朋友</span><br>
      2026 年 9 月 18 日
    </p>

  </main>

</body>
</html>
