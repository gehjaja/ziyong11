<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#f7f1e6" />
<meta name="format-detection" content="telephone=no" />
<title>在哪，都想石家庄</title>
<meta name="description" content="不管你在哪座城，这里有一句写给你和石家庄的话。" />
<style>
/* ============================================================
   设计基调：旧信纸 + 砖红。字体用系统中文衬线，秒开、无外链。
   ============================================================ */
:root{
  --paper:#f7f1e6;
  --paper-2:#f0e7d7;
  --ink:#211a15;
  --ink-2:#55493f;
  --ink-3:#8a7c6e;
  --brick:#a8342a;
  --brick-soft:#c25a3c;
  --line:rgba(120,95,70,.18);
  --card:#fffdf8;
  --serif:"Songti SC","Noto Serif CJK SC","Source Han Serif SC","Source Han Serif CN",STSong,SimSun,"Times New Roman",serif;
  --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","HarmonyOS Sans SC","Noto Sans CJK SC","Microsoft YaHei",system-ui,sans-serif;
  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  min-height:100vh;min-height:100dvh;
  background:
    radial-gradient(120% 70% at 50% -10%, #fffaf0 0%, rgba(255,250,240,0) 60%),
    linear-gradient(180deg,var(--paper) 0%, var(--paper-2) 100%);
  background-attachment:fixed;
  color:var(--ink);
  font-family:var(--sans);
  font-size:16px;
  line-height:1.8;
  overflow-x:hidden;
}
body::after{ /* 极淡的纸纹，纯 CSS，无图片请求 */
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.5;
  background-image:
    radial-gradient(rgba(120,95,70,.055) 1px, transparent 1.2px),
    radial-gradient(rgba(120,95,70,.035) 1px, transparent 1.2px);
  background-size:17px 17px, 29px 29px;
  background-position:0 0, 9px 13px;
}
.wrap{position:relative;z-index:1;max-width:600px;margin:0 auto;padding:calc(var(--safe-t) + 18px) 20px calc(var(--safe-b) + 34px)}

/* ---------------- 顶部 ---------------- */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:40px}
.brand{font-family:var(--serif);font-size:14px;letter-spacing:.18em;color:var(--ink-3)}
.btn-plain{
  appearance:none;border:1px solid var(--line);background:rgba(255,253,248,.7);
  color:var(--ink-2);font-family:var(--sans);font-size:13px;line-height:1;
  padding:9px 13px;border-radius:999px;cursor:pointer;transition:.18s;
}
.btn-plain:active{transform:scale(.96);background:#fff}

/* ---------------- 卡片 ---------------- */
.card{
  margin-top:20px;background:var(--card);border:1px solid var(--line);border-radius:18px;
  padding:26px 22px 22px;box-shadow:0 1px 0 rgba(255,255,255,.9) inset,0 12px 30px -18px rgba(80,55,35,.35);
}
.seal{
  display:inline-flex;align-items:center;gap:7px;font-family:var(--serif);font-size:12.5px;
  letter-spacing:.14em;color:var(--brick);border:1px solid rgba(168,52,42,.35);
  background:rgba(168,52,42,.055);border-radius:6px;padding:4px 9px;
}
.seal i{width:5px;height:5px;border-radius:50%;background:var(--brick);display:block;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}

h1{
  font-family:var(--serif);font-weight:600;margin:16px 0 0;letter-spacing:.04em;
  font-size:clamp(30px,10.2vw,42px);line-height:1.24;
}
h1 .accent{color:var(--brick)}
.sub{margin:14px 0 0;color:var(--ink-2);font-size:15.5px;line-height:1.9}
.rule{height:1px;background:linear-gradient(90deg,var(--line),rgba(120,95,70,.04));margin:22px 0 0}

.meta{
  display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;margin:16px 0 0;
  font-size:13px;color:var(--ink-3);min-height:23px;
}
.meta b{font-weight:600;color:var(--ink-2);font-family:var(--serif)}
.dot{width:3px;height:3px;border-radius:50%;background:var(--ink-3);opacity:.5}
.typing::after{content:"…";opacity:.6;animation:pulse 1.2s ease-in-out infinite}

/* ---------------- 主按钮 ---------------- */
.actions{margin-top:22px;display:flex;flex-direction:column;gap:11px}
.btn-primary{
  appearance:none;border:0;cursor:pointer;width:100%;
  background:linear-gradient(180deg,var(--brick-soft),var(--brick));
  color:#fff8f2;font-family:var(--serif);font-size:18px;letter-spacing:.1em;
  padding:16px 18px;border-radius:14px;
  box-shadow:0 10px 22px -12px rgba(168,52,42,.85),0 1px 0 rgba(255,255,255,.25) inset;
  transition:transform .16s,filter .16s;
}
.btn-primary:active{transform:translateY(1px) scale(.99);filter:brightness(.96)}
.btn-primary[disabled]{opacity:.55;filter:grayscale(.2)}
.btn-ghost{
  appearance:none;cursor:pointer;width:100%;background:transparent;border:1px solid var(--line);
  color:var(--ink-2);font-family:var(--sans);font-size:14.5px;padding:12px 18px;border-radius:13px;
  transition:.18s;
}
.btn-ghost:active{background:rgba(255,255,255,.8)}
.hint{margin:12px 2px 0;font-size:12.5px;color:var(--ink-3);line-height:1.7}

/* ---------------- 阅读页 ---------------- */
.screen{display:none;animation:fade .5s ease both}
.screen.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

.loc{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  font-family:var(--serif);font-size:13.5px;color:var(--ink-3);letter-spacing:.06em;
}
.loc .pin{color:var(--brick);font-size:15px}
.loc .cities{color:var(--ink-2);font-weight:600;letter-spacing:.1em}

.copy{position:relative;padding:2px 0 0}
.copy .lead{
  font-family:var(--serif);font-weight:600;letter-spacing:.03em;
  font-size:clamp(24px,7.4vw,32px);line-height:1.4;margin:16px 0 0;color:var(--ink);
}
.copy .body p{
  margin:18px 0 0;font-family:var(--serif);font-size:17px;line-height:2.05;
  color:var(--ink-2);letter-spacing:.015em;text-align:justify;
}
.copy .body p:first-child{margin-top:22px}
.copy .body p:last-child{color:var(--ink);font-weight:600}
.copy .sign{
  margin-top:24px;font-family:var(--serif);font-size:14px;color:var(--ink-3);
  letter-spacing:.08em;display:flex;align-items:center;gap:10px;
}
.copy .sign::before{content:"";width:26px;height:1px;background:var(--line)}
.item{opacity:0;transform:translateY(9px);transition:opacity .62s ease,transform .62s cubic-bezier(.22,.8,.3,1)}
.item.in{opacity:1;transform:none}

/* ---------------- 骨架 ---------------- */
.skel{margin-top:8px}
.skel i{display:block;height:13px;border-radius:7px;margin-top:14px;
  background:linear-gradient(90deg,rgba(120,95,70,.09),rgba(120,95,70,.16),rgba(120,95,70,.09));
  background-size:200% 100%;animation:sh 1.25s linear infinite}
.skel i:nth-child(2){width:88%} .skel i:nth-child(3){width:74%} .skel i:nth-child(4){width:62%}
@keyframes sh{from{background-position:200% 0}to{background-position:-200% 0}}

/* ---------------- 再次进入的入口 ---------------- */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:22px}
.tile{
  appearance:none;cursor:pointer;text-align:left;background:rgba(255,253,248,.72);
  border:1px solid var(--line);border-radius:14px;padding:13px 14px;color:var(--ink-2);
  font-family:var(--sans);font-size:14px;transition:.18s;
}
.tile:active{transform:scale(.98);background:#fff}
.tile b{display:block;font-family:var(--serif);font-size:15px;color:var(--ink);margin-bottom:3px}
.tile span{font-size:12px;color:var(--ink-3)}

.foot{margin-top:26px;text-align:center;font-size:12px;color:var(--ink-3);letter-spacing:.06em;line-height:2}

/* ---------------- 城市选择面板 ---------------- */
.sheet{
  position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;justify-content:flex-end;
  background:rgba(33,26,21,.42);backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .26s;
}
.sheet.on{opacity:1;pointer-events:auto}
.sheet-in{
  background:var(--paper);border-radius:20px 20px 0 0;max-height:86vh;display:flex;flex-direction:column;
  transform:translateY(14px);transition:transform .3s cubic-bezier(.22,.8,.3,1);
  box-shadow:0 -14px 40px -20px rgba(60,40,25,.5);
}
.sheet.on .sheet-in{transform:none}
.sheet-hd{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:16px 18px 12px;border-bottom:1px solid var(--line);
}
.sheet-hd h3{margin:0;font-family:var(--serif);font-size:17px;font-weight:600;letter-spacing:.06em}
.sheet-bd{overflow:auto;padding:8px 18px calc(var(--safe-b) + 18px);-webkit-overflow-scrolling:touch}
.grp{margin-top:14px}
.grp h4{margin:0 0 9px;font-family:var(--serif);font-size:13px;color:var(--ink-3);font-weight:600;letter-spacing:.14em}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{
  appearance:none;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink-2);
  font-size:14px;padding:9px 13px;border-radius:999px;transition:.16s;font-family:var(--sans);
}
.chip:active{transform:scale(.95)}
.chip[data-home="1"]{border-color:rgba(168,52,42,.4);color:var(--brick);background:rgba(168,52,42,.06)}

.toast{
  position:fixed;left:50%;bottom:calc(var(--safe-b) + 26px);transform:translate(-50%,12px);
  background:rgba(33,26,21,.92);color:#f7f1e6;font-size:13.5px;padding:11px 16px;border-radius:999px;
  z-index:60;opacity:0;pointer-events:none;transition:.26s;max-width:82vw;text-align:center;
}
.toast.on{opacity:1;transform:translate(-50%,0)}

@media (prefers-reduced-motion:reduce){
  *{animation-duration:.001s!important;transition-duration:.001s!important}
  .item{opacity:1;transform:none}
}
@media (min-width:620px){
  .wrap{padding-top:38px}
  .card{padding:34px 32px 30px;border-radius:20px}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div class="brand">石 家 庄 · 同 乡 书</div>
    <button class="btn-plain" id="btnPickTop" type="button">换个城市</button>
  </div>

  <!-- ============ 首屏：纯本地渲染，不等待任何网络 ============ -->
  <section class="card screen on" id="screenCover">
    <span class="seal"><i></i>在 外 的 石 家 庄 人</span>
    <h1>你在哪座城，<br /><span class="accent">石家庄</span>都还认得你。</h1>
    <p class="sub">
      一句话，写给从石家庄走出去、现在散在各地的我们。<br />
      按你此刻的位置，给你一段只属于那座城的话。
    </p>
    <div class="rule"></div>
    <div class="meta" id="meta">
      <span id="metaText">正在感知你在哪座城市</span>
      <span class="dot"></span>
      <span>文案已就绪</span>
    </div>
    <div class="actions">
      <button class="btn-primary" id="btnStart" type="button">看看写给我的那段话</button>
      <button class="btn-ghost" id="btnPick" type="button">我不在常用的城市 · 手动选</button>
    </div>
    <p class="hint">位置只用在你手机上这一次，不会被保存，也不会上传给别人。定位不准的话，随时可以自己选城市。</p>
  </section>

  <!-- ============ 阅读页 ============ -->
  <section class="card screen" id="screenRead">
    <div class="loc">
      <span class="pin">◎</span>
      <span>你现在在</span>
      <span class="cities" id="locCity">—</span>
      <span class="dot"></span>
      <button class="btn-plain" id="btnPick2" type="button" style="padding:5px 10px;font-size:12px">不准？换</button>
    </div>

    <div class="copy" id="copyBox" hidden>
      <p class="lead" id="lead"></p>
      <div class="body" id="body"></div>
      <div class="sign">写给 石家庄 · <span id="signWho">同乡</span></div>
    </div>

    <div class="skel" id="skel"><i></i><i></i><i></i><i></i></div>

    <div class="tiles" id="tiles" hidden>
      <button class="tile" id="btnCopy" type="button"><b>复制这段话</b><span>发给同乡，看看他在哪</span></button>
      <button class="tile" id="btnShare" type="button"><b>分享到微信</b><span>右上角 · 发给同乡</span></button>
      <button class="tile" id="btnAgain" type="button"><b>再读一遍</b><span>重新播一次这段字</span></button>
      <button class="tile" id="btnPick3" type="button"><b>看看别的城市</b><span>手动挑一个地方</span></button>
    </div>

    <div class="foot">— 不管走多远，中山路还是那条中山路 —</div>
  </section>
</div>

<!-- ============ 城市选择面板 ============ -->
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="选择城市">
  <div class="sheet-in">
    <div class="sheet-hd">
      <h3>你现在在哪座城？</h3>
      <button class="btn-plain" id="sheetClose" type="button">关闭</button>
    </div>
    <div class="sheet-bd" id="sheetBody"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<!-- ============================================================
     顺序很重要，也是这套东西的关键设计：
     1) copies.js —— 纯数据、纯本地，同步执行，几百 KB 以内，秒出文案；
     2) app.js    —— 启动后才去发定位请求。
     所以"进初始界面"这件事，一次网络请求都不需要等。
     ============================================================ -->
<script>
  /* 兜底提示：万一某个脚本没加载上或运行出错，别让页面静悄悄卡住 ——
     直接把故障显示出来，好排查也好截图反馈。正常情况下这段什么都不做。 */
  window.addEventListener('error', function (e) {
    var el = document.getElementById('bootErr');
    if (!el) {
      el = document.createElement('div');
      el.id = 'bootErr';
      el.style.cssText = 'position:fixed;left:0;right:0;bottom:0;z-index:99;padding:10px 12px;' +
        'background:#a8342a;color:#fff;font:13px/1.5 -apple-system,sans-serif;white-space:pre-wrap';
      el.textContent = '页面没能正常启动：' + ((e && (e.message || (e.target && e.target.src))) || '未知错误') +
        '\n把这张截图发回给我就行。';
      (document.body || document.documentElement).appendChild(el);
    }
    return false;
  }, true);
</script>
<script>
/* =========================================================================
 * copies.js —— 怀乡文案库（纯数据，无任何依赖 / 无网络请求）
 * 设计原则：本文件必须最先就绪，地理定位永远在它之后才开始请求。
 * 即：进初始界面 = 纯本地渲染，0 网络往返。
 *
 * 数据结构：
 *   COPY.cities              按城市名索引（优先级最高，命中即用）
 *   COPY.provinces[省名].cities[城名]   省内城市专属文案
 *   COPY.provinces[省名].fallback       该省兜底文案
 *   COPY.others.area.types   泛化规则（按 IP 服务返回的"区/县"级地名关键词匹配，如"大学/高新区"）
 *   COPY.others.fallback     全国通用文案
 *   COPY.shijiazhuang        人在石家庄（不参与 other 切换）
 *
 * 每条文案：{ title: 标题一行, body: 正文（数组，每项一段） }
 * 写好之后你也可以随时自己改，纯文本，改完刷新即可。
 * ========================================================================= */

const COPY = (function () {
  /** 小工具：让下面几百条数据的写法保持极简 */
  const t = (title, body) => ({ title, body: Array.isArray(body) ? body : [body] });

  /* ---------------------------------------------------------------- *
   * 一、石家庄本地（人在家乡）
   * ---------------------------------------------------------------- */
  const shijiazhuang = t('你就在这儿', [
    '不用赶高铁，不用掐着日子等放假，你就在石家庄。',
    '晚上下班路过老火车站，风一吹还是小时候那股味儿；周末想吃板面就下楼，想吃缸炉烧饼就拐个弯，驴肉火烧得配一碗热汤。',
    '别人在外地刷着家乡菜咽口水，你刷的是"今天吃什么"——这是福气，别嫌它平常。',
    '好好吃饭，替我们几个在外面的人，多走两遍中山路。',
  ]);

  /* ---------------------------------------------------------------- *
   * 二、河北本省（other，含全部 11 个地市）
   * ---------------------------------------------------------------- */
  const hebei = {
    fallback: t('就在河北省内', [
      '出了石家庄，但没出河北——这距离，是最勾人的一种。',
      '高铁一两个小时，家里一个电话就能回；可偏偏这两小时，让你吃不到楼下那碗板面，也听不见巷子里那句"吃咧没"。',
      '同一条滹沱河，同一座太行山，同一句河北话，就是不在同一条街上。',
      '想家了就说一声，我请你吃驴肉火烧。',
    ]),
    cities: {
      保定: t('保定，离石家庄一个多小时', [
        '保定离石家庄是真近，一个多小时的车程——近到你总觉得"随时能回"，结果一学期也没回几趟。',
        '一样的冀中平原，一样的驴肉火烧，一样的河北话。可你站在保定的街上，心里那个"家"字，还是拴在西边那座城。',
        '在这儿照顾好自己，回石家庄，我请你吃热乎的。',
      ]),
      唐山: t('唐山，河北的东边', [
        '唐山的海货真多，可你就是觉得，不如家里楼下那碗板面实在。',
        '咱俩都是河北人，出省在外地遇见，是能当场抱一下的那种。可你在唐山，我在石家庄，中间还是隔着三百多公里。',
        '有空回来，中山路还是那条中山路，人还是那帮人。',
      ]),
      秦皇岛: t('秦皇岛，有海的那一头', [
        '秦皇岛的海是真好看，可你一说起家乡，脑子里全是滹沱河、正定城墙和中山路的车流。',
        '你在海边吹着风，小时候的夏天其实是在石家庄过的：槐底村的树荫，傍晚楼下"咕咚咕咚"的洒水车。',
        '有空回来，我带你吃顿热乎的驴肉火烧——海边的鲜，换不来这口咸香。',
      ]),
      邯郸: t('邯郸，往南三百里', [
        '邯郸到石家庄三百多公里，说远不远，说近也真不近——刚好远到"想回不能立刻回"。',
        '你在丛台、在滏阳河边走走，会不会突然想起咱们小时候一起爬过的那段老城墙？',
        '在外地照顾好自己，回来咱们还是老地方见。',
      ]),
      邢台: t('邢台，太行山下', [
        '邢台和石家庄，中间就隔着一座太行。翻过去是一个多小时，翻不过来是一整个学期。',
        '你在那边吃得好不好？板面、火烧、烧饼，石家庄有的，那边未必有那个味儿。',
        '放假回来一趟吧，咱们把欠下的饭补上。',
      ]),
      沧州: t('沧州，运河边上', [
        '沧州的火锅鸡再香，也压不住你想家门口那碗面的念头。',
        '你在运河边长大？不，咱们是在滹沱河边长大的。运河的水声再古老，也不是小时候听见的那一种。',
        '有空回来，中山路上慢慢走。',
      ]),
      廊坊: t('廊坊，夹在北京和石家庄之间', [
        '廊坊这地方，离北京近，离石家庄也不远，可它就是"哪儿都不是家"。',
        '你每天看着往北京去的人流，自己心里想的是那班往石家庄开的车。',
        '别熬太晚。想吃了，随时回来，驴肉火烧照样给你留着。',

  /* ---------------------------------------------------------------- *
   * 五、城市 → 文案 的解析（在定位成功后才调用，不影响首屏）
   * ---------------------------------------------------------------- */
  const stripCity = (s) => String(s == null ? '' : s).trim().replace(/市$/, '');

  /** 区县字段里的各种写法 → 候选城市名："武汉东湖高新区" → 武汉 / 武汉东湖 … */
  function districtCandidates(d) {
    const s = String(d == null ? '' : d).trim();
    if (!s) return [];
    const out = [];
    const push = (v) => { v = String(v || '').trim().replace(/市$/, ''); if (v && out.indexOf(v) < 0) out.push(v); };

    push(s);
    let core = s.replace(/(新区|开发区|经济开发区|高新技术产业开发区|高新区|工业园区|产业园|园区|自治县|自治州|地区|盟|区|县|市)$/, '');
    push(core);
    // 中文地名里城市名基本都在最前面，逐步截短一定能撞上"武汉""苏州"这类键
    for (let n = Math.min(core.length, 8); n >= 2; n--) push(core.slice(0, n));
    if (s.indexOf('市') > 0) push(s.slice(0, s.indexOf('市')));
    return out;
  }

  /** 抽掉行政区划后缀，只留"名字"：石家庄市→石家庄、河北省→河北、内蒙古自治区→内蒙古 */
  const norm = (s) =>
    String(s == null ? '' : s)
      .trim()
      .replace(/(省|市|特别行政区|自治区|自治州|自治县|地区|盟|区|县)$/, '');

  /** 省名的各种写法 → provinces 表里的键（表内用简称：河北 / 新疆 / 广西 …） */
  const HEAD_BY_LEN = [3, 2];   // 黑龙江 / 内蒙古 是 3 字，其余 2 字
  function matchProvince(raw) {
    const s = String(raw == null ? '' : raw).trim();
    if (!s) return '';
    if (provinces[s]) return s;
    for (const n of HEAD_BY_LEN) if (s.length > n && provinces[s.slice(0, n)]) return s.slice(0, n);
    const b = norm(s);
    if (provinces[b]) return b;
    for (const n of HEAD_BY_LEN) if (b.length > n && provinces[b.slice(0, n)]) return b.slice(0, n);
    return '';
  }

  /**
   * 解析城市 → 文案
   * @param {{province?:string, city?:string, district?:string, country?:string}} loc
   * @returns {{key:string, kind:string, copy:{title,body}}}
   */
  function resolve(loc) {
    loc = loc || {};
    const country = String(loc.country || '').trim();
    const provinceRaw = String(loc.province || '').trim();
    const cityRaw = String(loc.city || '').trim();
    const district = String(loc.district || '').trim();

    // 0) 国外
    if (country && !/^(中国|China|CN|CHN|中国大陆)$/i.test(country)) {
      return { key: 'overseas:' + country, kind: 'overseas', copy: others.overseas };
    }

    const cityBase = stripCity(cityRaw);
    const districtCands = districtCandidates(district);
    const provinceBase = matchProvince(provinceRaw);
    const provinceLikeCity = matchProvince(cityRaw);   // 有些服务把"北京"塞在 city 字段

    // 1) 石家庄（含 IP 只给到区县的情况）
    const sjzHit =
      /石家庄/.test(provinceRaw + cityRaw + district) ||
      provinceBase === '石家庄' || cityBase === '石家庄';
    if (sjzHit) return { key: 'shijiazhuang', kind: 'home', copy: shijiazhuang };

    // 2) 直辖市 / 港澳：city 常为空，用省名（或 city 字段里的同名）当城市名
    const MUNI = ['北京', '天津', '上海', '重庆', '香港', '澳门'];
    const muni = MUNI.indexOf(provinceBase) >= 0 ? provinceBase
      : (MUNI.indexOf(norm(cityRaw)) >= 0 ? norm(cityRaw) : '');
    if (muni && provinces[muni]) {
      const p = provinces[muni];
      const c = p.cities && (p.cities[muni] || p.cities[cityBase]);
      return { key: muni, kind: 'city', copy: c || p.fallback };
    }

    // 3) 城市级文案：city 字段优先，其次 district（"武汉东湖高新区"这种）
    for (const cName of [cityBase].concat(districtCands)) {
      if (cName && COPY.cities[cName]) return { key: cName, kind: 'city', copy: COPY.cities[cName] };
    }

    // 4) 按省：先省内城市，再省兜底
    const pKey = provinceBase || provinceLikeCity;
    const p = provinces[pKey];
    if (p) {
      for (const cName of [cityBase].concat(districtCands)) {
        if (cName && p.cities && p.cities[cName]) {
          return { key: cName, kind: 'city', copy: p.cities[cName] };
        }
      }
      return { key: pKey + '(省)', kind: 'province', copy: p.fallback };
    }

    // 5) 区县级关键词泛化（大学城、高新区……）
    const area = district + cityRaw + provinceRaw;
    for (const rule of others.area.types) {
      for (const k of rule.keys) {
        if (area.indexOf(k) >= 0) return { key: 'area:' + k, kind: 'area', copy: rule.copy };
      }
    }

    // 6) 全国兜底
    return { key: 'unknown-city', kind: 'fallback', copy: others.fallback };
  }

  /* ---------------------------------------------------------------- *
   * 六、手动选择用的完整城市清单（也是给"定位不准"留的出口）
   * ---------------------------------------------------------------- */
  function buildPicker() {
    const groups = [];

    groups.push({
      label: '我就在石家庄',
      items: [{ value: '河北省|石家庄市', label: '石家庄' }],
    });

    groups.push({
      label: '河北省内',
      items: Object.keys(hebei.cities).map((c) => ({ value: '河北省|' + c + '市', label: c })),
    });

    // 按省份分组输出（北京/天津/上海/重庆/港澳 作为独立一组）
    const order = [
      '北京', '天津', '上海', '重庆',
      '广东', '江苏', '浙江', '山东', '河南', '山西', '陕西', '湖北', '湖南', '安徽',
      '福建', '江西', '四川', '云南', '贵州', '广西', '海南',
      '辽宁', '吉林', '黑龙江', '甘肃', '青海', '宁夏', '新疆', '西藏',
      '香港', '澳门',
    ];
    const provinceCityNames = {
      广东: ['广州', '深圳', '珠海', '东莞', '佛山'],
      江苏: ['南京', '苏州', '无锡', '常州', '徐州', '南通'],
      浙江: ['杭州', '宁波', '温州', '绍兴', '嘉兴'],
      山东: ['济南', '青岛', '烟台'],
      河南: ['郑州', '洛阳'],
      山西: ['太原'],
      陕西: ['西安'],
      湖北: ['武汉'],
      湖南: ['长沙'],
      安徽: ['合肥'],
      福建: ['福州', '厦门', '泉州'],
      江西: ['南昌'],
      四川: ['成都'],
      云南: ['昆明'],
      贵州: [],
      广西: ['南宁', '桂林'],
      海南: ['海口', '三亚'],
      辽宁: ['沈阳', '大连'],
      吉林: ['长春'],
      黑龙江: ['哈尔滨'],
      甘肃: ['兰州'],
      青海: [],
      宁夏: [],
      新疆: ['乌鲁木齐'],
      西藏: ['拉萨'],
    };

    for (const pName of order) {
      const MUNI = ['北京', '天津', '上海', '重庆', '香港', '澳门'];
      if (MUNI.indexOf(pName) >= 0) {
        groups.push({ label: pName, items: [{ value: pName + '|' + pName + '市', label: pName }] });
        continue;
      }
      const names = provinceCityNames[pName] || [];
      const items = names.map((c) => ({ value: pName + '省|' + c + '市', label: c + '（' + pName + '）' }));
      if (items.length) groups.push({ label: pName, items });
    }

    return groups;
  }

  return {
    shijiazhuang,
    cities: {
      // 汇总所有"城市级"文案，供解析时 O(1) 命中
      北京: provinces.北京.cities.北京,
      天津: provinces.天津.cities.天津,
      上海: provinces.上海.cities.上海,
      广州: provinces.广东.cities.广州,
      深圳: provinces.广东.cities.深圳,
      珠海: provinces.广东.cities.珠海,
      东莞: provinces.广东.cities.东莞,
      佛山: provinces.广东.cities.佛山,
      南京: provinces.江苏.cities.南京,
      苏州: provinces.江苏.cities.苏州,
      无锡: provinces.江苏.cities.无锡,
      常州: provinces.江苏.cities.常州,
      徐州: provinces.江苏.cities.徐州,
      南通: provinces.江苏.cities.南通,
      杭州: provinces.浙江.cities.杭州,
      宁波: provinces.浙江.cities.宁波,
      温州: provinces.浙江.cities.温州,
      绍兴: provinces.浙江.cities.绍兴,
      嘉兴: provinces.浙江.cities.嘉兴,
      济南: provinces.山东.cities.济南,
      青岛: provinces.山东.cities.青岛,
      烟台: provinces.山东.cities.烟台,
      郑州: provinces.河南.cities.郑州,
      洛阳: provinces.河南.cities.洛阳,
      太原: provinces.山西.cities.太原,
      西安: provinces.陕西.cities.西安,
      武汉: provinces.湖北.cities.武汉,
      长沙: provinces.湖南.cities.长沙,
      合肥: provinces.安徽.cities.合肥,
      福州: provinces.福建.cities.福州,
      厦门: provinces.福建.cities.厦门,
      泉州: provinces.福建.cities.泉州,
      南昌: provinces.江西.cities.南昌,
      成都: provinces.四川.cities.成都,
      昆明: provinces.云南.cities.昆明,
      南宁: provinces.广西.cities.南宁,
      桂林: provinces.广西.cities.桂林,
      海口: provinces.海南.cities.海口,
      三亚: provinces.海南.cities.三亚,
      沈阳: provinces.辽宁.cities.沈阳,
      大连: provinces.辽宁.cities.大连,
      长春: provinces.吉林.cities.长春,
      哈尔滨: provinces.黑龙江.cities.哈尔滨,
      兰州: provinces.甘肃.cities.兰州,
      乌鲁木齐: provinces.新疆.cities.乌鲁木齐,
      拉萨: provinces.西藏.cities.拉萨,
      香港: provinces.香港.cities.香港,
      澳门: provinces.澳门.cities.澳门,
      // 河北 11 市
      保定: hebei.cities.保定,
      唐山: hebei.cities.唐山,
      秦皇岛: hebei.cities.秦皇岛,
      邯郸: hebei.cities.邯郸,
      邢台: hebei.cities.邢台,
      沧州: hebei.cities.沧州,
      廊坊: hebei.cities.廊坊,
      衡水: hebei.cities.衡水,
      张家口: hebei.cities.张家口,
      承德: hebei.cities.承德,
    },
    provinces,
    hebei,
    others,
    resolve,
    buildPicker,
  };
})();

if (typeof module !== 'undefined' && module.exports) module.exports = COPY;

<script>
/* =========================================================================
 * app.js —— 交互与定位
 * 关键约定：这个文件加载完之后，首屏其实已经画好了；定位是"后置"的，
 *          用户点按钮时才真正开始等，所以进界面的速度不受网络影响。
 * ========================================================================= */
(function () {
  'use strict';

  var $ = function (id) { return document.getElementById(id); };
  var MIN_WAIT = 520;          // 点了按钮之后，最短的"感知"时长，避免闪一下
  var CACHE_KEY = 'sjz_where_v1';

  var state = {
    started: false,
    loc: null,        // {province, city, district, country, source}
    copy: null,
    resolve: null,    // 正在进行的定位 Promise
    manual: false,    // 是否用户手动选的
    revealTimer: null
  };

  /* =====================================================================
   * 一、位置来源
   * 顺序刻意这样排：
   *   1) 上一次的选择（sessionStorage）—— 0 请求，最快，同一次会话内不会问第二遍
   *   2) IP 定位 —— 无需授权、不需要 HTTPS、国内手机最容易成功
   *   3) 浏览器精确定位 —— 只在 IP 失败时才发起，成功率高但可能要授权
   * ===================================================================== */

  function readCache() {
    try {
      var raw = sessionStorage.getItem(CACHE_KEY);
      if (!raw) return null;
      var o = JSON.parse(raw);
      if (o && (o.province || o.city)) { o.source = 'cache'; return o; }
    } catch (e) {}
    return null;
  }
  function writeCache(loc) {
    try { sessionStorage.setItem(CACHE_KEY, JSON.stringify(loc)); } catch (e) {}
  }

  function fetchJSON(url, ms) {
    var ctl = typeof AbortController !== 'undefined' ? new AbortController() : null;
    return new Promise(function (resolve, reject) {
      var timer = setTimeout(function () {
        if (ctl) ctl.abort();
        reject(new Error('timeout'));
      }, ms || 3500);
      var opt = { cache: 'no-store', credentials: 'omit' };
      if (ctl) opt.signal = ctl.signal;
      fetch(url, opt)
        .then(function (r) { return r.json(); })
        .then(function (j) { clearTimeout(timer); resolve(j); })
        .catch(function (e) { clearTimeout(timer); reject(e); });
    });
  }

  function clean(s) { return String(s == null ? '' : s).trim(); }

  /* ---------------------------------------------------------------------
   * 英文城市名 → 中文
   * 有些服务（ipwho.is / api.ip.sb / ipinfo.io）对中国用户返回拼音，
   * 而文案库的键是中文，所以先统一翻译一遍，再交给 COPY.resolve。
   * --------------------------------------------------------------------- */
  var CITY_ZH = {
    // 直辖市
    Beijing: '北京', Shanghai: '上海', Tianjin: '天津', Chongqing: '重庆',
    // 河北
    Shijiazhuang: '石家庄', Baoding: '保定', Tangshan: '唐山', Qinhuangdao: '秦皇岛',
    Handan: '邯郸', Xingtai: '邢台', Cangzhou: '沧州', Langfang: '廊坊',
    Hengshui: '衡水', Zhangjiakou: '张家口', Chengde: '承德',
    // 主要城市
    Guangzhou: '广州', Shenzhen: '深圳', Zhuhai: '珠海', Dongguan: '东莞', Foshan: '佛山',
    Nanjing: '南京', Suzhou: '苏州', Wuxi: '无锡', Changzhou: '常州', Xuzhou: '徐州', Nantong: '南通',
    Hangzhou: '杭州', Ningbo: '宁波', Wenzhou: '温州', Shaoxing: '绍兴', Jiaxing: '嘉兴',
    Jinan: '济南', Qingdao: '青岛', Yantai: '烟台', Weihai: '威海', Weifang: '潍坊',
    Zhengzhou: '郑州', Luoyang: '洛阳', Taiyuan: '太原', Xian: "西安", Xian2: '西安',
    Wuhan: '武汉', Changsha: '长沙', Hefei: '合肥',
    Fuzhou: '福州', Xiamen: '厦门', Quanzhou: '泉州', Nanchang: '南昌',
    Chengdu: '成都', Kunming: '昆明', Guiyang: '贵阳',
    Nanning: '南宁', Guilin: '桂林', Haikou: '海口', Sanya: '三亚',
    Shenyang: '沈阳', Dalian: '大连', Changchun: '长春', Harbin: '哈尔滨',
    Lanzhou: '兰州', Xining: '西宁', Yinchuan: '银川',
    Urumqi: '乌鲁木齐', Lhasa: '拉萨',
    'Hong Kong': '香港', Macau: '澳门', Macao: '澳门', Taipei: '台北',
  };

  /** 省份字段的英文/拼音 → 中文（仅当服务用英文时才需要） */
  var PROVINCE_ZH = {
    Hebei: '河北', Beijing: '北京', Tianjin: '天津', Shanghai: '上海', Chongqing: '重庆',
    Guangdong: '广东', Jiangsu: '江苏', Zhejiang: '浙江', Shandong: '山东', Henan: '河南',
    Shanxi: '山西', Shaanxi: '陕西', Hubei: '湖北', Hunan: '湖南', Anhui: '安徽',
    Fujian: '福建', Jiangxi: '江西', Sichuan: '四川', Yunnan: '云南', Guizhou: '贵州',
    Guangxi: '广西', Hainan: '海南', Liaoning: '辽宁', Jilin: '吉林', Heilongjiang: '黑龙江',
    Gansu: '甘肃', Qinghai: '青海', Ningxia: '宁夏', Xinjiang: '新疆', Tibet: '西藏', Xizang: '西藏',
    'Inner Mongolia': '内蒙古', 'Hong Kong': '香港', Macau: '澳门', Macao: '澳门',
    JiangsuSheng: '江苏', // 部分服务会带 Sheng 后缀
  };

  /** 归一化：把英文字段换成中文，并生成 COPY.resolve 能直接吃的对象 */
  function normalize(loc) {
    if (!loc) return loc;
    var out = { country: loc.country, province: loc.province, city: loc.city, district: loc.district || '', source: loc.source };
    if (out.country && !/中国|China|CN/i.test(out.country)) out.country = '国外';

    var strip = function (s) {
      return clean(s).replace(/ Shi$| shi$| Sheng$| Province$| Municipality$| City$/i, '').trim();
    };
    var city = strip(out.city);
    var prov = strip(out.province);

    if (city && CITY_ZH[city]) city = CITY_ZH[city];
    if (prov && PROVINCE_ZH[prov]) prov = PROVINCE_ZH[prov];

    // 服务偶尔把 "Jiangsu, Nanjing" / "Nanjing, Jiangsu" 塞进同一个字段
    [city, prov].forEach(function (v, i) {
      if (v && /[,，/]/.test(v)) {
        v.split(/[,，/]/).forEach(function (piece) {
          var p = strip(piece);
          if (!p) return;
          if (CITY_ZH[p] && !city) city = CITY_ZH[p];
          else if (PROVINCE_ZH[p] && !prov) prov = PROVINCE_ZH[p];
          else if (/[\u4e00-\u9fa5]/.test(p)) { if (i === 0) { if (!city) city = p; } else if (!prov) prov = p; }
        });
      }
    });

    out.city = city;
    out.province = prov;
    // 只剩拼音、又查不到时，别把它当中文城市名用，交给兜底文案
    if (out.city && !/[\u4e00-\u9fa5]/.test(out.city)) out.city = '';
    if (out.province && !/[\u4e00-\u9fa5]/.test(out.province)) out.province = '';
    return out;
  }

  /** 把各家 IP 服务的返回统一成 {province, city, district, country} */
  var IP_PROVIDERS = [
    {
      name: 'ipwho',
      url: 'https://ipwho.is/?fields=success,country,country_code,region,city',
      map: function (j) {
        if (!j || j.success === false) return null;
        return {
          country: j.country_code === 'CN' ? '中国' : clean(j.country),
          province: clean(j.region),
          city: clean(j.city),
          district: ''
        };
      }
    },
    {
      name: 'ipsb',
      url: 'https://api.ip.sb/geoip',
      map: function (j) {
        if (!j || !(j.country || j.region || j.city)) return null;
        var code = clean(j.country_code || j.country);
        return {
          country: code === 'CN' || /China/i.test(code) ? '中国' : clean(j.country),
          province: clean(j.region),
          city: clean(j.city),
          district: ''
        };
      }
    },
    {
      name: 'ipinfo',
      url: 'https://ipinfo.io/json',
      map: function (j) {
        if (!j || !(j.city || j.region)) return null;
        return {
          country: j.country === 'CN' ? '中国' : clean(j.country),
          province: clean(j.region),
          city: clean(j.city),
          district: ''
        };
      }
    },
    {
      name: 'ipapi.is',
      url: 'https://api.ipapi.is/',
      map: function (j) {
        if (!j || !(j.city || j.region)) return null;
        return {
          country: /China/i.test(clean(j.country)) ? '中国' : clean(j.country),
          province: clean(j.region),
          city: clean(j.city),
          district: ''
        };
      }
    },
    {
      // 免费版只支持 http；https 页面下会被浏览器拦掉，属于最后的补充
      name: 'ip-api',
      url: 'http://ip-api.com/json/?fields=status,country,countryCode,regionName,city&lang=zh-CN',
      map: function (j) {
        if (!j || j.status !== 'success') return null;
        return {
          country: j.countryCode === 'CN' ? '中国' : clean(j.country),
          province: clean(j.regionName),
          city: clean(j.city),
          district: ''
        };
      }
    }
  ];

  /** 首个成功的结果胜出，其它全部丢弃 —— 只等一个请求的时间 */
  function locateByIP() {
    var jobs = IP_PROVIDERS.map(function (p) {
      return fetchJSON(p.url, 4000)
        .then(function (j) {
          var loc = normalize(p.map(j));
          if (!loc || (!loc.province && !loc.city)) throw new Error('empty:' + p.name);
          loc.source = 'ip:' + p.name;
          return loc;
        });
    });
    return firstSuccess(jobs);
  }

  function firstSuccess(promises) {
    if (typeof Promise.any === 'function') return Promise.any(promises);
    return new Promise(function (resolve, reject) {
      var left = promises.length, errs = [];
      if (!left) return reject(new Error('no provider'));
      promises.forEach(function (p) {
        Promise.resolve(p).then(resolve, function (e) {
          errs.push(e);
          if (--left === 0) reject(errs[0] || new Error('all failed'));
        });
      });
    });
  }

  /** 经纬度 → 省/市：时区接口免 key、支持跨域，用来给点精确定位兜底 */
  function locateByCoords() {
    return new Promise(function (resolve, reject) {
      if (!navigator.geolocation) return reject(new Error('no geolocation'));
      navigator.geolocation.getCurrentPosition(function (pos) {
        var lat = pos.coords.latitude, lon = pos.coords.longitude;
        fetchJSON('https://dev.virtualearth.net/REST/v1/TimeZone/' + lat + ',' + lon + '?timezone=DEFAULT&includeDaylightSaving=false', 4000)
          .then(function (j) {
            var tz = '';
            try {
              tz = j.resourceSets[0].resources[0].timeZone.ianaTimeZone || '';
            } catch (e) {}
            var loc = tzToLoc(tz);
            loc.lat = lat; loc.lon = lon; loc.source = 'gps';
            if (!loc.province && !loc.city) throw new Error('tz unknown');
            resolve(loc);
          })
          .catch(function () { reject(new Error('tz failed')); });
      }, function () { reject(new Error('denied')); }, { timeout: 6000, maximumAge: 300000 });
    });
  }

  /** 时区名 → 省/市（只覆盖最常用的那批，用于 GPS 路径兜底） */
  function tzToLoc(tz) {
    var t = String(tz || '');
    var table = {
      'Asia/Shanghai': { province: '上海', city: '上海' },
      'Asia/Chongqing': { province: '重庆', city: '重庆' },
      'Asia/Urumqi': { province: '新疆', city: '乌鲁木齐' },
      'Asia/Harbin': { province: '黑龙江', city: '哈尔滨' },
      'Asia/Kashgar': { province: '新疆', city: '' },
      'Asia/Hong_Kong': { province: '香港', city: '香港' },
      'Asia/Macau': { province: '澳门', city: '澳门' },
      'Asia/Taipei': { province: '台湾', city: '' }
    };
    var hit = table[t];
    if (hit) { return { country: '中国', province: hit.province, city: hit.city, district: '' }; }
    if (/^Asia\//.test(t)) return { country: '中国', province: '', city: '', district: '' };
    if (!t) return { country: '', province: '', city: '', district: '' };
    return { country: '国外', province: '', city: '', district: '' };
  }

  /** 总入口：一次会话只跑一次 */
  function locate() {
    if (state.resolve) return state.resolve;
    var cached = readCache();
    if (cached) {
      state.resolve = Promise.resolve(cached);
      return state.resolve;
    }
    state.resolve = locateByIP()
      .catch(function () { return locateByCoords(); })
      .then(function (loc) {
        writeCache(loc);
        return loc;
      });
    return state.resolve;
  }

  /* =====================================================================
   * 二、文案渲染（全部本地，无请求）
   * ===================================================================== */

  function displayName(loc) {
    if (!loc) return '—';
    if (loc.city && loc.province && loc.city !== loc.province) return loc.city;
    return loc.city || loc.province || '你的城市';
  }

  /* 万一取文案这一步出了任何岔子，也不能让同学看见空白页：
     退到最后一句兜底话，同时把骨架屏收掉。 */
  function safeCopy() {
    var fb = '先把这句话给你，剩下的等我慢慢说。';
    if (typeof COPY === 'undefined' || !COPY) return { title: '在哪，都想石家庄', body: [fb] };
    try { var r = COPY.resolve(state.loc || {}); if (r && r.copy && r.copy.title && r.copy.copy.body) return r; } catch (e) {}
    try { if (COPY.others && COPY.others.fallback) return { title: COPY.others.fallback.title, body: COPY.others.fallback.body }; } catch (e2) {}
    return { title: '在哪，都想石家庄', body: [fb] };
  }

  function applyLocation(loc) {
    var r;
    try { r = COPY.resolve(loc); } catch (e) { r = safeCopy(); }
    if (!r || !r.copy) r = safeCopy();
    state.loc = loc;
    state.copy = r;
    $('locCity').textContent = loc && (loc.city || loc.province) ? displayName(loc) : '未知城市';
    if (loc && loc.district && /区|县|新区/.test(loc.district) && displayName(loc) !== loc.district) {
      $('locCity').textContent = displayName(loc) + ' · ' + loc.district;
    }
    $('signWho').textContent = displayName(loc) === '石家庄' ? '在家的人' : '在' + displayName(loc) + '的同乡';
  }

  function renderCopy() {
    var c = (state.copy && state.copy.copy) || safeCopy().copy;
    $('lead').textContent = c.title;
    var box = $('body');
    box.innerHTML = '';
    (c.body || []).forEach(function (text) {
      var p = document.createElement('p');
      p.textContent = text;
      box.appendChild(p);
    });
    if (state.copy && state.copy.kind === 'home') $('locCity').textContent = '石家庄';
    $('skel').hidden = true;          // 文案到位，收起骨架
    $('copyBox').hidden = false;
  }

  /** 逐段浮现，读起来像有人在慢慢跟你说 */
  function reveal() {
    var nodes = $('copyBox').querySelectorAll('.item, .lead, .body p, .sign');
    var list = [];
    var lead = $('lead');
    list.push(lead);
    Array.prototype.forEach.call($('body').children, function (p) { list.push(p); });
    list.push(document.querySelector('#copyBox .sign'));

    list.forEach(function (n) { if (!n) return; n.classList.add('item'); n.classList.remove('in'); });
    $('tiles').hidden = true;
    clearTimeout(state.revealTimer);

    var i = 0;
    (function step() {
      if (i >= list.length) {
        $('tiles').hidden = false;
        $('tiles').classList.add('item');
        requestAnimationFrame(function () { $('tiles').classList.add('in'); });
        return;
      }
      if (list[i]) list[i].classList.add('in');
      i++;
      state.revealTimer = setTimeout(step, i === 1 ? 90 : 210);
    })();
  }

  /* =====================================================================
   * 三、界面流转
   * ===================================================================== */

  function show(screen) {
    $('screenCover').classList.toggle('on', screen === 'cover');
    $('screenRead').classList.toggle('on', screen === 'read');
    window.scrollTo(0, 0);
  }

  function toast(msg) {
    var el = $('toast');
    el.textContent = msg;
    el.classList.add('on');
    clearTimeout(el._t);
    el._t = setTimeout(function () { el.classList.remove('on'); }, 2000);
  }

  /** 首页那行"正在感知…"，用滚动城市名表示在算，定位一回来立刻落定 */
  function startMetaRoll() {
    var pool = ['北京', '上海', '广州', '深圳', '杭州', '成都', '武汉', '西安', '天津', '南京', '长沙', '青岛', '郑州', '哈尔滨', '乌鲁木齐'];
    var el = $('metaText');
    var i = Math.floor(Math.random() * pool.length);
    el.classList.add('typing');
    var timer = setInterval(function () {
      i = (i + 1) % pool.length;
      el.textContent = '正在感知你在哪座城市 · ' + pool[i];
    }, 260);
    return function stop(finalText) {
      clearInterval(timer);
      el.classList.remove('typing');
      if (finalText) el.textContent = finalText;
    };
  }

  function onStart() {
    if (state.started) return;
    state.started = true;
    $('btnStart').disabled = true;

    var stopRoll = startMetaRoll();
    var t0 = Date.now();

    locate()
      .then(function (loc) { return finish(loc, null); })
      .catch(function (err) { return finish(null, err); });

    function finish(loc, err) {
      var wait = Math.max(0, MIN_WAIT - (Date.now() - t0));
      setTimeout(function () {
        if (loc && (loc.province || loc.city)) {
          stopRoll('你在 ' + displayName(loc));
        } else {
          stopRoll('没定位成功，先按"远方"写给你');
        }
        applyLocation(loc || { province: '', city: '', district: '' });
        if (!loc || (!loc.province && !loc.city)) {
          var c = COPY.others.unknown;
          state.copy = { kind: 'unknown', copy: c };
        }
        renderCopy();
        show('read');
        reveal();
      }, wait);
    }
  }

  function chooseManual(province, city) {
    state.manual = true;
    state.resolve = Promise.resolve({ country: '中国', province: province, city: city, district: '', source: 'manual' });
    writeCache({ country: '中国', province: province, city: city, district: '', source: 'manual' });
    applyLocation({ province: province, city: city, district: '' });
    renderCopy();
    show('read');
    reveal();
  }

  /* =====================================================================
   * 四、城市选择面板
   * ===================================================================== */

  var REGION_ORDER = [
    { label: '华北', names: ['北京', '天津', '山西', '内蒙古'] },
    { label: '华东', names: ['上海', '江苏', '浙江', '安徽', '福建', '江西', '山东'] },
    { label: '华中 · 华南', names: ['河南', '湖北', '湖南', '广东', '广西', '海南'] },
    { label: '西南', names: ['重庆', '四川', '贵州', '云南', '西藏'] },
    { label: '东北', names: ['辽宁', '吉林', '黑龙江'] },
    { label: '西北', names: ['陕西', '甘肃', '青海', '宁夏', '新疆'] },
    { label: '港澳台', names: ['香港', '澳门', '台湾'] }
  ];

  var PICKER = (function () {
    var raw = COPY.buildPicker();
    return raw;
  })();

  function buildPickerUI() {
    var host = $('sheetBody');
    if (host.dataset.built) return;
    host.dataset.built = '1';

    // 1) 石家庄 + 河北省：放最前面，因为最常用
    PICKER.slice(0, 2).forEach(function (g) {
      host.appendChild(groupEl(g.label, g.items));
    });

    // 2) 之后按大区归类，顺序更符合直觉
    var byLabel = {};
    PICKER.slice(2).forEach(function (g) { byLabel[g.label] = g.items; });

    REGION_ORDER.forEach(function (reg) {
      var frag = document.createDocumentFragment();
      var any = false;
      reg.names.forEach(function (pName) {
        if (byLabel[pName]) { byLabel[pName].forEach(function (it) { frag.appendChild(chipEl(it, pName)); }); any = true; }
        delete byLabel[pName];
      });
      if (any) host.appendChild(groupFrag(reg.label, frag));
    });

    // 3) 剩余的（比如没归类的）兜底
    Object.keys(byLabel).forEach(function (k) { host.appendChild(groupEl(k, byLabel[k])); });
  }

  function chipEl(item, pName) {
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'chip';
    if (/石家庄/.test(item.value)) b.setAttribute('data-home', '1');
    b.textContent = item.label;
    b.addEventListener('click', function () {
      var parts = item.value.split('|');
      closeSheet();
      chooseManual(parts[0] || '', parts[1] || '');
    });
    return b;
  }

  function groupEl(label, items) {
    var frag = document.createDocumentFragment();
    items.forEach(function (it) { frag.appendChild(chipEl(it, label)); });
    return groupFrag(label, frag);
  }

  function groupFrag(label, frag) {
    var g = document.createElement('div');
    g.className = 'grp';
    var h = document.createElement('h4');
    h.textContent = label;
    g.appendChild(h);
    var c = document.createElement('div');
    c.className = 'chips';
    c.appendChild(frag);
    g.appendChild(c);
    return g;
  }

  /* 面板开关。微信里弹出的面板，按手机返回键应当先关面板、而不是退出页面，
     所以打开时压一条 history，返回时（popstate）收起来。 */
  var sheetPushed = false;
  function openSheet() {
    if ($('sheet').classList.contains('on')) return;
    buildPickerUI();
    $('sheet').classList.add('on');
    if (!sheetPushed) {
      sheetPushed = true;
      try { history.pushState({ sheet: 1 }, ''); } catch (e) { sheetPushed = false; }
    }
  }
  function closeSheet() {
    $('sheet').classList.remove('on');
    if (sheetPushed) {
      sheetPushed = false;
      try { history.back(); } catch (e) {}
    }
  }
  window.addEventListener('popstate', function () {
    if (sheetPushed) {
      sheetPushed = false;
      $('sheet').classList.remove('on');
    }
  });

  /* =====================================================================
   * 五、分享 / 复制
   * ===================================================================== */

  function shareOrCopy(silent) {
    if (!state.copy) return;
    var who = state.loc && (state.loc.city || state.loc.province) ? displayName(state.loc) : '外地';
    var text = '【' + state.copy.copy.title + '】\n\n' + state.copy.copy.body.join('\n') +
      '\n\n—— 写给在' + who + '的石家庄人';
    var title = '在哪，都想石家庄';

    if (!silent && navigator.share) {
      navigator.share({ title: title, text: text }).then(function () {}, function () {});
      return;
    }
    var done = function () { toast(silent ? '这段话已复制' : '已复制，去粘贴给同乡吧'); };
    var fail = function () {
      // 极少数旧浏览器：用临时输入框兜底
      try {
        var ta = document.createElement('textarea');
        ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
        document.body.appendChild(ta); ta.select(); document.execCommand('copy');
        document.body.removeChild(ta); done();
      } catch (e) { toast('复制失败，长按文字手动复制吧'); }
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done, fail);
    } else { fail(); }
  }

  /* =====================================================================
   * 六、绑定
   * ===================================================================== */

  $('btnStart').addEventListener('click', onStart);
  $('btnPick').addEventListener('click', openSheet);
  $('btnPickTop').addEventListener('click', openSheet);
  $('btnPick2').addEventListener('click', openSheet);
  $('btnPick3').addEventListener('click', openSheet);
  $('sheetClose').addEventListener('click', closeSheet);
  $('sheet').addEventListener('click', function (e) { if (e.target === $('sheet')) closeSheet(); });
  $('btnAgain').addEventListener('click', reveal);
  $('btnCopy').addEventListener('click', function () { shareOrCopy(true); });
  $('btnShare').addEventListener('click', function () { shareOrCopy(false); });

  /* 首屏已就绪：文案在本地、按钮永远可点。
     顺手提前把定位请求发出去，等用户真点的时候往往已经有结果了 —— 但它绝不阻塞首屏。 */
  if ('requestIdleCallback' in window) {
    requestIdleCallback(function () { locate().catch(function () {}); }, { timeout: 1200 });
  } else {
    setTimeout(function () { locate().catch(function () {}); }, 400);
  }

  /* --- 方便本地预览/自测的两个参数（对同学无感，不写就等于不存在） -------
     ?at=上海              跳过定位，直接按这个城市渲染（可写"河北省|保定市"）
     ?at=上海&go=1         同上，并且自动进入阅读页，省得手点               */
  (function urlHelper() {
    var at = '';
    try { at = new URLSearchParams(location.search).get('at') || ''; } catch (e) { at = ''; }
    if (!at) return;
    var parts = at.indexOf('|') > 0 ? at.split('|') : ['', at];
    try {
      chooseManual(parts[0], parts[1]);
      if (new URLSearchParams(location.search).get('go') === '1') onStart();
    } catch (e) {}
  })();
})();

</script>
</body>
